name: REMEMBER checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: node --test tests/server-contract.test.mjs
      - run: bun test tests/bridge-dictionary.test.ts
      - run: bun test tests/situation-context.test.ts
      - run: bun test tests/prediction-integrity.test.ts

      - run: bun test tests/core-discovery.test.ts
      - run: bun test tests/discovery-fix-regressions.test.ts
      - run: bun test tests/cross-examination.test.ts
      - run: bun test tests/grounding-integrity.test.ts
