name: REMEMBER checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun test tests/roundTableControl.test.ts
      - run: node --test tests/server-contract.test.mjs
      - name: Browser smoke screenshots
        run: |
          npx --yes playwright install chromium
          NODE_ENV=production PORT=43177 node server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:43177/api/health >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p screenshots
          npx --yes playwright screenshot --browser chromium --viewport-size "390,844" http://127.0.0.1:43177 screenshots/mobile.png
          npx --yes playwright screenshot --browser chromium --viewport-size "1440,900" http://127.0.0.1:43177 screenshots/desktop.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remember-ui-smoke
          path: screenshots
          if-no-files-found: ignore
